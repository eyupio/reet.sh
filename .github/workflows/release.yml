name: binary release

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag or dev (latest main) to build and publish'
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/install.sh'
      - 'scripts/install_test.go'
      - 'scripts/publish-release.sh'
      - 'scripts/publish_release_test.go'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'brand/logo/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.tag || (github.ref == 'refs/heads/main' && 'dev') || github.ref_name }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: zoomies-linux-x64
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag == 'dev' && 'refs/heads/main' || inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - id: source
        env:
          REET_REF: ${{ inputs.tag || (github.ref == 'refs/heads/main' && 'dev') || github.ref_name }}
          REET_REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
        run: |
          version=dev
          if [ "$REET_REF_TYPE" = tag ]; then
            [[ "$REET_REF" = dev || "$REET_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || { echo 'Expected dev or a version tag such as v1.2.3' >&2; exit 1; }
            version=$REET_REF
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

  web:
    needs: source
    runs-on: zoomies-linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: web/dist
          include-hidden-files: true

  verify:
    # image.yml already runs `go vet ./... && go test -race ./...` on every pull request, so repeating the same suite
    # here doubled the cost of each code pull request without adding a check. Packaging still runs on pull requests
    # (web, build), and every release event keeps the full gate before publish can run.
    if: github.event_name != 'pull_request'
    needs: [source, web]
    runs-on: zoomies-linux-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Install tmux when the runner lacks it
        run: |
          if command -v tmux >/dev/null; then tmux -V; exit 0; fi
          if [ "$(id -u)" = 0 ]; then as_root=""; elif command -v sudo >/dev/null; then as_root="sudo"; else
            echo "::error::tmux is missing and this runner is neither root nor has sudo to install it."; exit 1; fi
          $as_root apt-get update && $as_root apt-get install -y tmux
          tmux -V
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: web/dist
      # internal/store alone runs close to 20 minutes under -race, which made the old
      # per-package timeout race the clock. Keep a margin over it.
      - run: go vet ./... && go test -race -timeout=30m ./...

  build:
    # Only web is needed to package: the Go sources come from the checkout, not from verify. Waiting for verify made
    # every release event take the tests and the archives one after the other; publish still waits for both.
    needs: [source, web]
    runs-on: zoomies-linux-x64
    strategy:
      fail-fast: false
      matrix:
        # A pull request proves the packaging path once. macOS is not lost: native-services and private-connection
        # compile and test the same Go code on macos-latest at pull request time. Releases still build every target
        # before publishing, so nothing untested can ship.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["linux"]' || '["linux","darwin"]') }}
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: web/dist
      - name: Build release archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
          REET_REF: ${{ needs.source.outputs.tag }}
        run: |
          version=$REET_REF
          REET_SHA=$(git rev-parse HEAD)
          mkdir -p staging artifacts
          go build -trimpath -ldflags="-s -w -X main.version=$version -X main.commit=$REET_SHA" -o staging/reet ./cmd/reet
          cp LICENSE README.md staging/
          REET_EPOCH=$(git show -s --format=%ct HEAD)
          tar --sort=name --mtime="@$REET_EPOCH" --owner=0 --group=0 --numeric-owner \
            -cf - -C staging reet LICENSE README.md | gzip -n > "artifacts/reet_${version}_${GOOS}_${GOARCH}.tar.gz"
      - uses: actions/upload-artifact@v4
        # Publish is what consumes these archives, and it never runs for a pull request. Uploading there only left
        # artifacts for the cleanup workflow to prune later.
        if: github.event_name != 'pull_request'
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/*

  publish:
    if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && needs.verify.result == 'success'
    needs: [source, build, verify]
    runs-on: zoomies-linux-x64
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true
      - name: Publish checksummed binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REET_TAG: ${{ needs.source.outputs.tag }}
          REET_SHA: ${{ needs.source.outputs.sha }}
        run: bash scripts/publish-release.sh artifacts
