name: native services

on:
  pull_request:
    paths:
      - 'internal/terminalhost/**'
      - 'internal/scan/**'
      - 'internal/agenthealth/**'
      - 'internal/privateconn/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-services.yml'
  push:
    branches: [main]
    paths:
      - 'internal/terminalhost/**'
      - 'internal/scan/**'
      - 'internal/agenthealth/**'
      - 'internal/privateconn/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-services.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-service:
    name: native service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          sleep 2
          systemctl --user daemon-reload
          systemctl --user status --no-pager || true
      - name: Run terminal host tests
        run: go test -race -count=1 -timeout=3m ./internal/terminalhost
      - name: Run native service test
        env:
          REET_NATIVE_SERVICE_TESTS: '1'
        run: go test -race -count=1 -timeout=4m -run TestNativeAgentKillKeepsTmuxSession -v ./internal/terminalhost
