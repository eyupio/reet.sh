<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)" />

    <title>reet.sh – your shelf for everything AI</title>
    <meta
      name="description"
      content="reet.sh is the self-hosted shelf for the AI skills, agents and setups you and your team use: save and test skills, sync agents and machines, keep portable setups, share lists and teams, host your own skills, connect over MCP and keep sealed backups. One binary, one SQLite file, no telemetry."
    />
    <meta name="application-name" content="reet.sh" />
    <meta name="author" content="EyUp.io" />

    <!-- Open Graph / social previews. og:image must be an absolute URL, so this assumes the public origin https://reet.sh. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="reet.sh" />
    <meta property="og:title" content="reet.sh – your shelf for everything AI" />
    <meta property="og:description" content="A self-hosted shelf for AI skills, agents and setups: save and test skills, sync agents and machines, share lists, host your own and connect over MCP." />
    <meta property="og:url" content="https://reet.sh/" />
    <meta property="og:image" content="https://reet.sh/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The reet.sh logo, a white rose in a bookmark, above the line: your shelf for the AI skills, agents and setups you and your team use." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="reet.sh – your shelf for everything AI" />

    <meta name="twitter:image:alt" content="The reet.sh logo above the line: your shelf for the AI skills, agents and setups you and your team use." />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
