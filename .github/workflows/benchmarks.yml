name: benchmarks

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/bench-gate.py'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-benchmarks
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BENCH_REGEX: '^Benchmark(ListFor|ListForCompact|ListSkillsAPI(/.*)?|TerminalSessionsFor|AppendTerminalChatEventFor|AppendTerminalChatEventsFor32|PublishChatEvent)$'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/checkout@v4
        with:
          path: base
          repository: ${{ github.repository }}
          ref: ${{ github.base_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: pr/go.mod
          cache: true
          cache-dependency-path: pr/go.sum
      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Benchmark base
        shell: bash
        run: |
          cd base
          go test ./internal/api/ ./internal/store/ ./internal/terminalbroker/ \
            -run '^$' -bench "$BENCH_REGEX" -benchmem -count=8 -benchtime=200x \
            | tee /tmp/base.txt
      - name: Benchmark pull request
        shell: bash
        run: |
          cd pr
          go test ./internal/api/ ./internal/store/ ./internal/terminalbroker/ \
            -run '^$' -bench "$BENCH_REGEX" -benchmem -count=8 -benchtime=200x \
            | tee /tmp/new.txt
      - name: Compare with benchstat
        run: python3 pr/scripts/bench-gate.py /tmp/base.txt /tmp/new.txt 15
      - name: Keep the benchmark outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            /tmp/base.txt
            /tmp/new.txt
          retention-days: 7
