<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d201c" media="(prefers-color-scheme: dark)" />

    <!--
      The account holds the theme, but its profile only arrives after the API answers, so a dark preference painted light
      first. Read the copy applyTheme() leaves in this browser and apply it before the first paint; the profile corrects it
      if another browser chose differently.

      `data-js` is set here, before the body is parsed, so a browser can hide the crawler copy and show the boot shell in
      the same frame. Crawlers do not run this script and keep the readable landing copy below.
    -->
    <script>
      (function () {
        document.documentElement.dataset.js = ''
        try {
          var theme = localStorage.getItem('reet-theme')
          if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme
        } catch (e) {
          /* storage blocked: the profile applies the theme when it loads */
        }
        try {
          // Token instances keep the credential here; account sessions are hidden in an HttpOnly cookie the
          // server reads. Either way, hide the crawler landing page before first paint so a signed-in refresh
          // does not flash the logged-out page while the app boots.
          if (localStorage.getItem('reet-token')) document.documentElement.dataset.signedIn = ''
        } catch (e) {
          /* storage blocked: the app removes the fallback when it mounts */
        }
        // The server names the shell that matches this route (and already knows a cookie signed-in visitor). A static
        // preview or a host that serves index.html unchanged has no name yet, so pick it here; no more than one is painted.
        if (!document.documentElement.dataset.boot) {
          var path = location.pathname
          var signedIn = document.documentElement.dataset.signedIn !== undefined
          document.documentElement.dataset.boot = (path === '/' || path === '/welcome') && !signedIn ? 'auth'
            : (path === '/signin' || path === '/signup' || path === '/setup' || path === '/reset' || path.indexOf('/join') === 0) ? 'auth'
            : 'app'
        }
        if ((location.pathname === '/' || location.pathname === '/welcome') && document.documentElement.dataset.signedIn !== undefined) document.documentElement.dataset.boot = 'app'
        // Layout only: reserve the route's final width before authentication or
        // page code arrives. This never decides access to private content.
        var bootQuery = new URLSearchParams(location.search)
        var bootPath = location.pathname
        if (/^\/projects(?:\/[^/]+)?\/?$/.test(bootPath) || /^\/control\/?$/.test(bootPath)) bootPath = '/'
        if (/^\/(sessions|terminals)\/?$/.test(bootPath)) bootPath = '/sessions'
        try {
          if (localStorage.getItem('reet.rail.collapsed') === '1') document.documentElement.dataset.bootRail = 'collapsed'
        } catch (e) { /* Use the default expanded rail when storage is blocked. */ }
        document.documentElement.dataset.bootLayout = bootPath === '/' ? 'home'
          : ((bootPath === '/sessions' || bootPath === '/terminals') && bootQuery.get('view') !== 'list')
            || (['/machines', '/account/machines', '/account/sync'].indexOf(bootPath) !== -1 && bootQuery.get('view') === 'terminal') ? 'workspace'
          : 'content'
        // Reserve the installed app's navigation rail before its bundle or account response arrives.
        // This selects layout only; authentication still comes from the server.
        var phoneLayout = matchMedia('(max-width:650px), (max-height:500px) and (pointer:coarse) and (orientation:landscape)').matches
        var publicLayout = bootPath === '/community' || bootPath.indexOf('/l/') === 0
        if (document.documentElement.dataset.boot === 'app' && document.documentElement.dataset.bootLayout !== 'workspace' && !phoneLayout && !publicLayout) document.documentElement.dataset.workspaceShell = ''
        // A bundle that never arrives must not leave a silent skeleton. The recovery line lives outside the decorative
        // shell and starts empty, so putting words into its live region both shows it and announces it.
        window.setTimeout(function () {
          if (document.documentElement.dataset.ready) return
          var slow = document.getElementById('boot-slow')
          if (!slow) return
          slow.appendChild(document.createTextNode('Taking longer than usual. '))
          var reload = document.createElement('a')
          reload.href = ''
          reload.textContent = 'Reload'
          slow.appendChild(reload)
          slow.appendChild(document.createTextNode(' or check that reet.sh is running.'))
        }, 10000)
      })()
    </script>

    <!-- The two faces the boot shell and the first screen use, fetched while the bundle is still on its way. -->
    <link rel="preload" href="/fonts/fraunces-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />

<!--
      Workspace entry fallback for browsers that do not run JavaScript
      The installation is excluded from indexing. The SPA removes this fallback
      on mount. Public lists supply their own server-rendered content.
    -->

    <!--
      Everything a browser needs before the bundle runs, inline so it paints at once and needs no stylesheet of its own:
      the crawler copy stays hidden, and a theme-aware boot shell holds the page's shape until the app is ready. The
      literals are the two palettes, because this style is the only styling a first paint can count on.
    -->
    <style id="seo-fallback-style">
      html { background: #f6f5f0; }
      html[data-theme='dark'] { background: #1d201c; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #1d201c; } }

      /* A browser runs the head script, so it never sees the crawler page; a crawler gets it instead of the shell. */
      html[data-js] .crawl-fallback { display: none; }
      #boot { display: none; }
      html[data-js] #boot { display: block; }
      /* One route, one shell: a static preview carries every variant, and only the chosen one is painted. */
      #boot [data-boot] { display: none; }
      html[data-boot='welcome'] #boot [data-boot='welcome'],
      html[data-boot='app'] #boot [data-boot='app'] { display: block; }
      html[data-boot='auth'] #boot [data-boot='auth'] { display: grid; }

      .crawl-fallback { max-width: 760px; margin: 0 auto; padding: 56px 20px 72px; font: 16px/1.7 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink, #292b25); background: var(--bg, #f6f5f0); }
      .crawl-fallback a { color: var(--accent-text, #b84216); }
      .crawl-fallback .eyebrow { margin: 0 0 12px; font-size: .7rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text, #b84216); }
      .crawl-fallback h1 { margin: 0 0 18px; font: 500 clamp(2rem, 4vw, 3rem)/1.1 Georgia, serif; letter-spacing: -.03em; }
      .crawl-fallback h2 { margin: 40px 0 10px; font: 500 1.5rem/1.25 Georgia, serif; }
      .crawl-fallback h3 { margin: 26px 0 6px; font-size: 1rem; }
      .crawl-fallback p { margin: 0 0 12px; max-width: 66ch; }
      .crawl-fallback .lede { font-size: 1.05rem; }
      .crawl-fallback .cta { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 8px; }
      .crawl-fallback .cta a { display: inline-block; padding: 10px 14px; border: 1px solid var(--line, #dddfd5); border-radius: 8px; text-decoration: none; }
      .crawl-fallback .cta a.primary { background: var(--accent, #b84216); border-color: var(--accent, #b84216); color: var(--accent-ink, #fff); }
      .crawl-fallback .trust { color: #60675a; font-size: .85rem; }
      .crawl-fallback pre { padding: 16px; overflow-x: auto; border: 1px solid var(--line, #dddfd5); border-radius: 8px; background: var(--card, #fffefb); font: 13px/1.6 ui-monospace, Consolas, monospace; }
      .crawl-fallback ul { padding-left: 20px; }

      /* The boot shell. It is aria-hidden decoration: the app's own loading state carries the words. */
      #boot { --boot-bg: #f6f5f0; --boot-card: #fffefb; --boot-line: #e6e7de; --boot-line-soft: #eeede6; --boot-ink: #292b25; --boot-accent: #b84216;
        position: fixed; inset: 0; z-index: 100; overflow: hidden; background: var(--boot-bg); color: var(--boot-ink);
        font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      @media (prefers-color-scheme: dark) {
        #boot { --boot-bg: #1d201c; --boot-card: #262a24; --boot-line: #333a2f; --boot-line-soft: #272019; --boot-ink: #efeee5; --boot-accent: #ed976e; }
        html[data-theme='light'] #boot { --boot-bg: #f6f5f0; --boot-card: #fffefb; --boot-line: #e6e7de; --boot-line-soft: #eeede6; --boot-ink: #292b25; --boot-accent: #b84216; }
      }
      html[data-theme='dark'] #boot { --boot-bg: #1d201c; --boot-card: #262a24; --boot-line: #333a2f; --boot-line-soft: #272019; --boot-ink: #efeee5; --boot-accent: #ed976e; }
      html[data-theme='light'] #boot { --boot-bg: #f6f5f0; --boot-card: #fffefb; --boot-line: #e6e7de; --boot-line-soft: #eeede6; --boot-ink: #292b25; --boot-accent: #b84216; }

      html[data-ready] #boot { opacity: 0; pointer-events: none; transition: opacity 180ms cubic-bezier(.23, 1, .32, 1); }
      @media (prefers-reduced-motion: reduce) { html[data-ready] #boot { transition: none; } }

      #boot, #boot * { box-sizing: border-box; }
      .boot-bar { border-bottom: 1px solid var(--boot-line); }
      .boot-bar-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; max-width: 1120px; margin: 0 auto; padding: 24px 40px; }
      .boot-brand { display: block; width: 160px; max-width: 100%; animation: boot-in 320ms cubic-bezier(.23, 1, .32, 1) both; }
      .boot-brand svg { display: block; width: 100%; height: auto; }
      @keyframes boot-in { from { opacity: 0; transform: translateY(2px); } }
      .boot-nav { display: flex; align-items: center; gap: 12px; }
      .boot-pill { height: 30px; width: 74px; border-radius: 999px; background: var(--boot-line); }
      .boot-pill.wide { width: 96px; }
      .boot-main { max-width: 1120px; margin: 0 auto; padding: 38px 40px 56px; }
      .boot-card { border: 1px solid var(--boot-line); border-radius: 14px; background: var(--boot-card); }
      .boot-line { height: 13px; border-radius: 6px; background: var(--boot-line); }
      .boot-line.slim { height: 10px; }
      .boot-hero { display: grid; grid-template-columns: 1fr 1.05fr; gap: 48px; align-items: center; }
      .boot-copy { display: grid; gap: 16px; align-content: start; }
      .boot-eyebrow { height: 10px; width: 140px; }
      .boot-title { height: clamp(34px, 4.4vw, 52px); width: 94%; border-radius: 10px; }
      .boot-title.short { width: 68%; }
      .boot-lede { display: grid; gap: 9px; margin-top: 8px; }
      .boot-lede .boot-line { width: 92%; }
      .boot-lede .boot-line:last-child { width: 61%; }
      .boot-cta { display: flex; gap: 8px; margin-top: 12px; }
      .boot-button { height: 40px; width: 118px; border-radius: 8px; background: var(--boot-line); }
      .boot-button.primary { background: var(--boot-accent); opacity: .85; }
      .boot-trust { height: 10px; width: 210px; margin-top: 20px; }
      .boot-preview { padding: 14px; display: grid; gap: 10px; box-shadow: 0 15px 45px rgb(30 24 16 / .08); transform: rotate(-1deg); }
      .boot-preview .head { display: flex; justify-content: space-between; margin-bottom: 4px; }
      .boot-preview .row { height: 46px; border-radius: 8px; border: 1px solid var(--boot-line); background: var(--boot-bg); }
      .boot-preview .terminal { height: 150px; border-radius: 8px; background: #171e26; opacity: .88; }
      .boot-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 42px; padding-top: 32px; border-top: 1px solid var(--boot-line); }
      .boot-step { display: grid; gap: 12px; }
      .boot-step .boot-line:last-child { width: 80%; }

      .boot-page { display: grid; gap: 18px; }
      .boot-page-head { display: grid; gap: 12px; margin-bottom: 8px; }
      .boot-page-head .boot-line:first-child { width: 120px; height: 10px; }
      .boot-page-head .boot-line:nth-child(2) { width: 34%; height: 30px; border-radius: 8px; }
      .boot-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .boot-rows { display: grid; gap: 1px; border: 1px solid var(--boot-line); border-radius: 14px; overflow: hidden; background: var(--boot-line); }
      .boot-row { display: flex; align-items: center; gap: 16px; padding: 18px 20px; background: var(--boot-card); }
      .boot-row .boot-line { flex: 1; }
      .boot-row .boot-line:first-child { flex: 0 0 32%; }

      .boot-auth { display: grid; place-items: center; min-height: calc(100dvh - 82px); padding: 24px; }
      .boot-auth .boot-card { width: min(430px, 100%); padding: 28px; display: grid; gap: 14px; }
      .boot-auth .boot-line.title { width: 62%; height: 24px; }
      .boot-auth .boot-line.hint { width: 88%; height: 11px; }
      .boot-auth .field { height: 44px; border: 1px solid var(--boot-line); border-radius: 8px; background: var(--boot-bg); }
      .boot-auth .boot-button { width: 100%; }

      /* The recovery line sits outside #boot: the shell is aria-hidden, and this must reach a screen reader. Empty, it
         takes no room and says nothing; the head script fills it only after ten seconds. */
      .boot-slow { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 101; text-align: center; margin: 0 auto; max-width: 420px; padding: 10px 20px; font-size: .82rem; line-height: 1.6; color: #656c5e; }
      .boot-slow:empty { height: 0; padding: 0; overflow: hidden; opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) .boot-slow { color: #adb5a6; } }
      html[data-theme='dark'] .boot-slow { color: #adb5a6; }
      .boot-slow a { color: #b84216; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) .boot-slow a { color: #ed976e; } }
      html[data-theme='dark'] .boot-slow a { color: #ed976e; }

      @media (prefers-reduced-motion: no-preference) {
        #boot .boot-line, #boot .boot-pill, #boot .boot-button:not(.primary) { background: linear-gradient(90deg, var(--boot-line) 0%, var(--boot-line-soft) 50%, var(--boot-line) 100%); background-size: 200% 100%; animation: boot-shimmer 1.8s ease-in-out infinite; }
      }
      @keyframes boot-shimmer { to { background-position: -200% 0; } }
      @media (prefers-reduced-motion: reduce) { .boot-brand { animation: none; } }

      /* Signed-in chrome is full width, including while only HTML is available. */
      html[data-boot='app'] .boot-bar-inner { max-width: none; height: 60px; padding: 0 24px; }
      html[data-boot='app'] .boot-brand { width: 120px; animation: none; }
      /* The terminal's slim header, matching AppShell's compact bar: logo 120, 88 on a phone, with its own padding. */
      html[data-boot='app'][data-boot-layout='workspace'] .boot-bar-inner { height: 56px; padding: 0 16px; }
      html[data-boot='app'][data-boot-layout='workspace'] .boot-brand { width: 120px; }
      html[data-boot='app'][data-boot-layout='home'] .boot-main { max-width: none; padding: 20px 24px; margin-left: 301px; }
      html[data-boot='app'][data-boot-layout='home'][data-boot-rail='collapsed'] .boot-main { margin-left: 56px; }
      html[data-boot='app'][data-boot-layout='workspace'] .boot-main { max-width: none; padding: 8px 12px; }
      @media (max-width: 1239px) {
        html[data-boot='app'][data-boot-layout='home'] .boot-main { margin-left: 56px; }
      }
      @media (min-width: 651px) and (max-width: 799px) {
        html[data-boot='app']:not([data-boot-layout='workspace']) .boot-bar-inner { padding-inline: 16px; }
      }
      @media (max-width: 700px) {
        html[data-boot='app'][data-boot-layout='workspace'] .boot-bar-inner { height: 54px; padding: 0 10px; }
        html[data-boot='app'][data-boot-layout='workspace'] .boot-brand { width: 88px; }
      }
      @media (max-width: 1099px) {
        html[data-boot='app'] .boot-bar-inner { height: 64px; }
        html[data-boot='app'][data-boot-layout='home'] .boot-main,
        html[data-boot='app'][data-boot-layout='home'][data-boot-rail='collapsed'] .boot-main { margin-left: 0; }
      }
      @media (max-width: 700px) {
        html[data-boot='app'][data-boot-layout='workspace'] .boot-main { padding: 4px 6px; }
      }
      @media (max-width: 650px) {
        html[data-boot='app'] .boot-bar-inner { height: 56px; padding-inline: 16px; }
        html[data-boot='app'][data-boot-layout='home'] .boot-main { padding: 14px 16px; }
      }

      /* The bar keeps the real header's padding at each breakpoint, so the logo does not shift when the shell hands over. */
      @media (max-width: 1000px) { .boot-bar-inner { padding: 16px 24px; } }
      @media (max-width: 850px) {
        .boot-main { padding: 26px 24px 44px; }
        .boot-hero { grid-template-columns: 1fr; gap: 30px; }
        .boot-preview { max-width: 640px; transform: none; }
        .boot-steps { grid-template-columns: 1fr; gap: 20px; }
        .boot-cards { grid-template-columns: 1fr; }
      }
      @media (max-width: 560px) {
        .boot-bar-inner { padding: 20px 16px; }
        .boot-main { padding: 18px 16px 36px; }
        .boot-nav .boot-pill:not(.wide) { display: none; }
        .boot-preview .terminal { height: 120px; }
      }
      /* Keep the first paint aligned with the desktop workspace and its project rail. */
      .boot-workspace-sidebar { display: none; }
      @media (min-width: 1100px) {
        html[data-workspace-shell] #boot .boot-workspace-sidebar { display: block; position: absolute; inset: 0 auto 0 0; width: 228px; border-right: 1px solid var(--boot-line); background: var(--boot-bg); }
        .boot-workspace-sidebar .links { display: grid; gap: 22px; position: absolute; top: 123px; left: 30px; width: 166px; }
        .boot-workspace-sidebar .links i { display: block; height: 15px; border-radius: 4px; background: var(--boot-line); }
        html[data-workspace-shell] #boot .boot-bar-inner { padding-left: 264px; }
        html[data-workspace-shell] #boot .boot-brand { position: fixed; top: 24px; left: 28px; width: 134px; z-index: 1; }
        html[data-workspace-shell] #boot .boot-main { max-width: none; margin-left: 228px; margin-right: 0; width: calc(100% - 228px); }
        html[data-workspace-shell][data-boot-layout='home'] #boot .boot-main { margin-left: calc(228px + var(--boot-project-rail, 56px)); width: calc(100% - 228px - var(--boot-project-rail, 56px)); }
      }
      @media (min-width: 1240px) {
        html[data-workspace-shell][data-boot-layout='home']:not([data-boot-rail='collapsed']) { --boot-project-rail: 301px; }
      }
    </style>
  </head>

    <!-- The boot shell holds the page's shape while the bundle loads; the server keeps only the variant for this route. -->
    <div id="boot" aria-hidden="true"><div class="boot-workspace-sidebar"><div class="links"><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="boot-bar">
        <div class="boot-bar-inner">
