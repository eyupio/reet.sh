<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#14110f;font-family:"IBM Plex Sans",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:hover{filter:brightness(1.12)}
</style>
</helmet>
<!-- Layout: the sessions and projects list is its own screen on a phone, reached from the Sessions tab. Group switcher up top, 44 px rows. -->
<div style="width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;background:#14110f;color:#f1ebe4;overflow:hidden;font-size:15px">
<header style="height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #2a241f"><a href="PhoneHome.dc.html" aria-label="Back to home" style="width:44px;height:44px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:#cfc6bc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 style="margin:0;font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:600;flex-grow:1">Sessions</h1><a href="PhoneHome.dc.html" aria-label="New session" style="height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;background:#c2410c;color:#fff;font-weight:600">New</a></header>
<div style="flex:none;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
  <div style="display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid #342d27;border-radius:10px;background:#1a1613;color:#a39a90"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search sessions</div>
  <div style="display:flex;border:1px solid #342d27;border-radius:10px;overflow:hidden;font-size:14px"><span style="flex:1;text-align:center;padding:12px 0;background:#2a241f;font-weight:600">Project</span><span style="flex:1;text-align:center;padding:12px 0;color:#a39a90">Machine</span><span style="flex:1;text-align:center;padding:12px 0;color:#a39a90">State</span></div>
</div>
<div style="flex-grow:1;min-height:0;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:14px">
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div>
      <div style="display:flex;align-items:center;gap:8px;padding:0 2px 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="#5fc2a8" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12z"/></svg><span style="font-weight:600;flex-grow:1">{{g.name}}</span><span style="font-size:12px;color:#a39a90;border:1px solid #3d342d;border-radius:99px;padding:1px 8px">{{g.m}}</span></div>
      <div style="border:1px solid #342d27;border-radius:13px;background:#1a1613;overflow:hidden">
        <sc-for list="{{g.sessions}}" as="s" hint-placeholder-count="2"><a href="PhoneSession.dc.html" style="display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 14px;border-bottom:1px solid #2a241f"><span style="width:9px;height:9px;border-radius:50%;flex:none;background:{{s.c}}"></span><span style="flex-grow:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">{{s.t}}</span><span style="font-size:12px;color:#a39a90">{{s.age}}</span></a></sc-for>
      </div>
    </div>
  </sc-for>
  <div style="display:flex;align-items:center;gap:10px;padding-top:4px"><span style="flex-grow:1;font:600 11px 'IBM Plex Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#a39a90">Projects · 11</span><a href="PhoneAdd.dc.html" style="height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid #4a4037;border-radius:10px;font-weight:500">Add a project</a></div>
</div>
<nav style="height:64px;flex:none;display:flex;border-top:1px solid #2a241f;background:#110e0c">
  <a href="PhoneHome.dc.html" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a39a90;font-size:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 11l9-8 9 8v10H3z"/></svg>Home</a>
  <span style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#ff8d63;font-size:12px;font-weight:600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Sessions</span>
  <span style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a39a90;font-size:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Machines</span>
  <span style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#a39a90;font-size:12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</span>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#7fc79a', warn = '#e9b44c', info = '#7fb3d9', idle = '#a39a90';
    return {
      groups: [
        { name: 'reet', m: 'Elitebook', sessions: [
          { t: 'Refactor the store layer', c: ok, age: '12m' },
          { t: 'Add browse-v1 protocol', c: warn, age: '2m' },
          { t: 'Docs pass', c: idle, age: '1h' } ] },
        { name: 'jiggered', m: 'Server', sessions: [ { t: 'Review code', c: info, age: '9m' } ] },
        { name: 'zoomies-platform', m: 'Server', sessions: [ { t: 'Speed up the runner pool', c: ok, age: '34m' } ] }
      ]
    };
  }
}
</script>
</body>
</html>
