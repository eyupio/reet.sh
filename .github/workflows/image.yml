name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # These jobs are the full suite (web check, MCP tests, go vet, go test -race on every package), so they have to run whenever anything
  # it compiles could change. Documentation, brand artwork and the other workflows are not compiled into the binary or
  # the image, so a pull request that only touches those does not need a 20-minute Go run. Pushes and tags stay
  # unfiltered: every image that is published has been tested.
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'mcp/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('push-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  # The suite is split so it runs on several runners at once. `checks` is the web check, the MCP tests and go vet;
  # `go` is the Go tests under the race detector in four shards (scripts/ci-go-shard.sh: internal/store, each half
  # of internal/api, and every other package); `test` is the one result that publish and the branch rules wait for.
  checks:
    # Keep PR validation available when the self-hosted pool is offline.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm ci
        working-directory: mcp
      - name: Compile the MCP test fixture once, outside the tests' 180 s build limit
        run: go build -o /dev/null ./mcp/test/fixture
      - run: npm test
        working-directory: mcp
      - run: go vet ./...

  go:
    name: go (${{ matrix.shard }})
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    # Slowest observed shard: internal/api under -race, about 26 minutes whole, so about half each. The limit is well
    # over that; the old single job needed 90 minutes only because it ran everything one after another.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [store, api-1, api-2, rest]
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux when the runner lacks it
        run: |
          if command -v tmux >/dev/null; then tmux -V; exit 0; fi
          if [ "$(id -u)" = 0 ]; then as_root=""; elif command -v sudo >/dev/null; then as_root="sudo"; else
            echo "::error::tmux is missing and this runner is neither root nor has sudo to install it."; exit 1; fi
          # Use the host's package index when it has one; refresh it only as a fallback.
          if ! $as_root apt-get install -y --no-install-recommends tmux; then
            $as_root apt-get update
            $as_root apt-get install -y --no-install-recommends tmux
          fi
          tmux -V
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      # Several Go tests transpile the web client's TypeScript, so they need its packages.
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: mcp
      - name: Compile the MCP test fixture once, outside the tests' 180 s build limit
        run: go build -o /dev/null ./mcp/test/fixture
      - run: scripts/ci-go-shard.sh ${{ matrix.shard }}

  test:
    needs: [checks, go]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything passed
        run: |
          echo "checks: ${{ needs.checks.result }}, go: ${{ needs.go.result }}"
          [ "${{ needs.checks.result }}" = success ] && [ "${{ needs.go.result }}" = success ]

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: zoomies-linux-x64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # The two platforms' Go builds each compile modernc.org/libc, which takes over a gigabyte, and
      # BuildKit ran them side by side: on a runner with about 3 GB between the job and its Docker
      # daemon the compiler was killed ("cannot allocate memory"). One build step at a time keeps the
      # peak to a single compile; the cost is a minute or two of wall-clock.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
