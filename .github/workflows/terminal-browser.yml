name: terminal browser

on:
  pull_request:
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']
  push:
    branches: [main]
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terminal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci && npx playwright install --with-deps chromium && npm run check && npm run build
        working-directory: web
      - name: Exercise real browser, broker and persistent tmux shell
        env:
          REET_BROWSER_TESTS: '1'
          REET_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/terminal-browser
        run: go test -race -count=1 -timeout=3m ./internal/api -run '^TestTerminalPrivateLifecyclePreservesActualShell$' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-browser
          path: ${{ runner.temp }}/terminal-browser
          if-no-files-found: ignore
