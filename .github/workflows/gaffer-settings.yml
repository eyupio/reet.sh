name: Gaffer settings browser

on:
  pull_request:
    paths: ['web/**', '.github/workflows/gaffer-settings.yml']
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/gaffer-settings.yml']

permissions:
  contents: read

concurrency:
  group: gaffer-settings-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gaffer-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          chromium_path="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          test -x "$chromium_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Exercise Gaffer settings and companion chat
        env:
          REET_UI_URL: http://127.0.0.1:4173
          REET_UI_SCREENSHOTS: ${{ runner.temp }}/gaffer-settings
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/gaffer-settings-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node web/tests/gaffer-settings.e2e.mjs
          node web/tests/gaffer-chat.e2e.mjs
          node web/tests/gaffer-context.e2e.mjs
          node web/tests/gaffer-worker.e2e.mjs
          node web/tests/gaffer-goal.e2e.mjs
          node web/tests/gaffer-followed.e2e.mjs
          node web/tests/gaffer-widget-ux.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaffer-settings
          path: ${{ runner.temp }}/gaffer-settings
          if-no-files-found: ignore
