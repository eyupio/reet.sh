{% if page.previous_page or page.next_page %}<nav class="doc-next" aria-label="More documentation"><span class="eyebrow">KEEP GOING</span>{% if page.next_page %}<a href="{{ page.next_page.url | url }}"><div><span>NEXT</span><strong>{{ page.next_page.title }}</strong></div>{{ icon('arrow') }}</a>{% endif %}{% if page.previous_page %}<a href="{{ page.previous_page.url | url }}"><div><span>PREVIOUS</span><strong>{{ page.previous_page.title }}</strong></div><span aria-hidden="true">←</span></a>{% endif %}</nav>{% endif %}
