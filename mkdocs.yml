    - Start an agent session: start-agent-session.md
    - Terminal workspace: terminal-workspace.md
    - Terminal launch: terminal-launch.md
    - Worktrees: terminal-worktrees.md
    - Folder browse: folder-browse.md
  - Skills and sync:
    - Skills and Sync: skills-machines-ux.md
    - Enrolled machines: controller-sync.md
    - Environments: environment-sync.md
    - Connect an AI client with MCP: mcp.md
    - Browser skill imports: browser-skill-import.md
    - Machine skill import: machine-skill-import.md
    - Machine content observations: machine-content-observations.md
    - Sharing and audiences: sharing.md
  - Work:
