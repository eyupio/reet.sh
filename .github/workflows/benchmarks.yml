name: benchmarks

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/bench-gate.py'
      - 'scripts/bench-compare.sh'
      - '.github/workflows/benchmarks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-benchmarks
  cancel-in-progress: true

jobs:
  compare:
    runs-on: zoomies-linux-x64
    timeout-minutes: 45
    env:
      BENCH_REGEX: '^Benchmark(Community|ListFor|ListForCompact|ListSkillsAPI(/.*)?|TerminalSessionsFor|AppendTerminalChatEventFor|AppendTerminalChatEventsFor32|PublishChatEvent)$'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pr
      - uses: actions/checkout@v4
        with:
          path: base
          repository: ${{ github.repository }}
          ref: ${{ github.base_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: pr/go.mod
          cache: true
          cache-dependency-path: pr/go.sum
      - name: Install benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Benchmark paired revisions
        shell: bash
        run: |
          bash pr/scripts/bench-compare.sh base pr "$RUNNER_TEMP/benchmarks"
      # A regression has to be seen twice. The first comparison names what looks
      # slower; only those benchmarks are measured again, in a fresh paired run,
      # and the job fails on what is still over the threshold. The threshold and
      # the significance are the same both times.
      - name: Compare with benchstat
        shell: bash
        run: |
          out="$RUNNER_TEMP/benchmarks"
          if python3 pr/scripts/bench-gate.py "$out/base.txt" "$out/new.txt" 15 --failed-to "$out/failed.txt"; then
            exit 0
          fi
          if ! grep -Eq '^[A-Za-z0-9_]+$' "$out/failed.txt"; then
            echo "bench-gate failed without naming a benchmark to measure again" >&2
            exit 1
          fi
          echo "Measuring again: $(paste -sd' ' "$out/failed.txt")"
          BENCH_REGEX="^Benchmark($(grep -E '^[A-Za-z0-9_]+$' "$out/failed.txt" | paste -sd'|'))\$" \
            bash pr/scripts/bench-compare.sh base pr "$out/confirm"
          python3 pr/scripts/bench-gate.py "$out/confirm/base.txt" "$out/confirm/new.txt" 15
      - name: Keep the benchmark outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            ${{ runner.temp }}/benchmarks/base.txt
            ${{ runner.temp }}/benchmarks/new.txt
            ${{ runner.temp }}/benchmarks/confirm/base.txt
            ${{ runner.temp }}/benchmarks/confirm/new.txt
          retention-days: 7
