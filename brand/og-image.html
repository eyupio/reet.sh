<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>reet.sh social image</title>
<style>
  /* 1200 x 630 social card. Colours are the brand's dark-mode palette (see README.md). */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #151413; color: #efece6; overflow: hidden;
    font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 88px; box-sizing: border-box; }
  /* The lockup SVG carries its own clear space (24 of 399 units on the left), so pull it back to line up with the text. */
  img { height: 150px; width: auto; align-self: flex-start; margin-left: -36px; }
  p.tag { margin: 40px 0 0; max-width: 880px; font: italic 400 56px/1.25 "Liberation Serif", "Times New Roman", Georgia, serif; color: #efece6; }
  .stages { display: flex; gap: 18px; margin-top: 52px; }
  .stage { position: relative; padding: 14px 26px 14px 30px; border: 2px solid #33312d; border-radius: 999px; font-size: 28px; font-weight: 500; color: #a8a399; }
  .stage.use { border-color: #fb923c; color: #efece6; }
  .stage.try { border-style: dashed; border-color: #fb923c; color: #efece6; }
  p.foot { position: absolute; right: 88px; bottom: 36px; margin: 0; font-size: 26px; color: #a8a399; }
</style>
</head>
<body>
  <img src="logo/horizontal-color-dark.svg" alt="reet.sh">
  <p class="tag">Your AI agents. Your machines.<br>One control room.</p>
  <div class="stages"><span class="stage use">Fleet</span><span class="stage try">Agents</span><span class="stage">Skills &amp; sync</span></div>
  <p class="foot">Self-hosted · persistent shells · no telemetry</p>
</body>
</html>
