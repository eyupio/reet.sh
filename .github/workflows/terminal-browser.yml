name: terminal browser

on:
  pull_request:
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']
  push:
    branches: [main]
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('push-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  terminal-browser:
    # Keep PR validation available when the self-hosted pool is offline.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    # The UI fixtures take about 9 minutes and the real-binary step then compiles Go from a cold cache; 15 was enough on
    # the GitHub-hosted runners but cancelled the job mid-compile on the Zoomies runners. Setup itself has since taken ten
    # minutes on a slow host, so the whole job needs headroom beyond the fixtures rather than a timeout spent on setup.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so npm run check's literal-colour test can diff this branch against origin/main instead of
          # checking Logo.svelte alone (a shallow clone has no merge base).
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install tmux when the runner lacks it
        run: |
          if command -v tmux >/dev/null; then tmux -V; exit 0; fi
          if [ "$(id -u)" = 0 ]; then as_root=""; elif command -v sudo >/dev/null; then as_root="sudo"; else
            echo "::error::tmux is missing and this runner is neither root nor has sudo to install it."; exit 1; fi
          $as_root apt-get update && $as_root apt-get install -y tmux
          tmux -V
      - name: Install DejaVu Sans Mono when the runner lacks it
        # The terminal's first font is "DejaVu Sans Mono". Without it the browser falls back to another monospace face with
        # different cell metrics (a 64x17 grid instead of 53x19 at the same size), so the phone layout checks that count
        # the rows and columns that fit fail on that runner only. ubuntu-latest has the font; the zoomies image did not.
        run: |
          # Consume the full list: grep -q can close early and make fc-list
          # fail with SIGPIPE under the runner's pipefail shell.
          have_font() { command -v fc-list >/dev/null && fc-list | grep -i 'DejaVu Sans Mono' >/dev/null; }
          if have_font; then echo "DejaVu Sans Mono is installed"; exit 0; fi
          if [ "$(id -u)" = 0 ]; then as_root=""; elif command -v sudo >/dev/null; then as_root="sudo"; else
            echo "::error::DejaVu Sans Mono is missing and this runner is neither root nor has sudo to install it."; exit 1; fi
          $as_root apt-get update && $as_root apt-get install -y fontconfig fonts-dejavu-core
          $as_root fc-cache -f
          if ! have_font; then echo "::error::fonts-dejavu-core installed but DejaVu Sans Mono is still not visible to fontconfig."; exit 1; fi
          fc-list | grep -i 'DejaVu Sans Mono' | sed -n '1,2p'
      - run: npm ci && npm run check && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
            # The tests default to /usr/bin/chromium; point them at the browser Playwright just installed.
            chromium_path="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" || chromium_path=""
            if [ -z "$chromium_path" ] || [ ! -x "$chromium_path" ]; then
              echo "::error::Playwright installed Chromium but gave no usable executable path ('$chromium_path'); the browser tests can't start."
              exit 1
            fi
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
          fi
      - name: Exercise dashboard and terminal workspace UI
        env:
          REET_UI_URL: http://127.0.0.1:4173
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/terminal-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node web/tests/public-workspace.e2e.mjs
          node web/tests/first-run.e2e.mjs
          node web/tests/session-board.e2e.mjs
          node web/tests/compact-work-items.e2e.mjs
          node web/tests/attention-contract.e2e.mjs
          node web/tests/phone-layout.e2e.mjs
          node web/tests/navigation.e2e.mjs
          node web/tests/loading.e2e.mjs
          node web/tests/loading-width.e2e.mjs
          node web/tests/readiness.e2e.mjs
          node web/tests/single-sign-on.e2e.mjs
          node web/tests/first-machine.e2e.mjs
          node web/tests/first-skills.e2e.mjs
          node web/tests/empty-states.e2e.mjs
          node web/tests/lists.e2e.mjs
          node web/tests/community.e2e.mjs
          node web/tests/supporting-nav.e2e.mjs
          node web/tests/spaces.e2e.mjs
          node web/tests/machines-search.e2e.mjs
          node web/tests/machines-fleet.e2e.mjs
          node web/tests/sync-vocabulary.e2e.mjs
          node web/tests/written-skill-record.e2e.mjs
          node web/tests/setups.e2e.mjs
          node web/tests/inbox.e2e.mjs
          node web/tests/admin-users.e2e.mjs
          node web/tests/admin-team.e2e.mjs
          node web/tests/admin-tickets.e2e.mjs
          node web/tests/admin-email.e2e.mjs
          node web/tests/admin-notifications.e2e.mjs
          node web/tests/admin-backups.e2e.mjs
          node web/tests/admin-settings.e2e.mjs
          node web/tests/admin-activity.e2e.mjs
          node web/tests/account-sessions.e2e.mjs
          node web/tests/account-tokens.e2e.mjs
          node web/tests/account-profile.e2e.mjs
          node web/tests/account-security.e2e.mjs
          node web/tests/account-mcp.e2e.mjs
          node web/tests/sync-activity.e2e.mjs
          node web/tests/sync-remove.e2e.mjs
          node web/tests/skills-sync-simple.e2e.mjs
          node web/tests/selected-library.e2e.mjs
          node web/tests/machine-item-states.e2e.mjs
          node web/tests/library.e2e.mjs
          node web/tests/connect-flow.e2e.mjs
          node web/tests/choose-entry.e2e.mjs
          node web/tests/sync-left-out.e2e.mjs
          node web/tests/sync-in-place.e2e.mjs
          node web/tests/fleet-software.e2e.mjs
          node web/tests/machine-skill-sync.e2e.mjs
          node web/tests/machine-add-skill.e2e.mjs
          node web/tests/skill-card.e2e.mjs
          node web/tests/control.e2e.mjs
          node web/tests/machine-import.e2e.mjs
          node web/tests/skill-content.e2e.mjs
          node web/tests/add-machine.e2e.mjs
          node web/tests/start-agent.e2e.mjs
          node web/tests/start-agent-source.e2e.mjs
          node web/tests/terminal-start.e2e.mjs
          node web/tests/open-terminal.e2e.mjs
          node web/tests/terminal-workspace.e2e.mjs
          node web/tests/terminal-lifecycle.e2e.mjs
          node web/tests/terminal-organisation.e2e.mjs
          node web/tests/terminal-phone.e2e.mjs
      - name: Exercise real browser, broker and persistent tmux shell
        env:
          REET_BROWSER_TESTS: '1'
          REET_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/terminal-browser
        run: go test -race -count=1 -timeout=3m ./internal/api -run '^TestTerminalPrivateLifecyclePreservesActualShell$' -v
      - name: Exercise explicitly enabled root shells
        run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$RUNNER_TEMP/root-go-cache" go test -race -count=1 -timeout=3m ./internal/terminalhost ./internal/scan -run 'TestManagerRetryAndRestartKeepOriginalProcess|TestAgentTerminalEnableAllowsExplicitRootConsent' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-browser
          path: ${{ runner.temp }}/terminal-browser
          if-no-files-found: ignore

  # Its own job, so the phone zoom contract, Home with its project rail, the retired Projects addresses and the Add project
  # dialog's later fixes run alongside the terminal job instead of adding to its time. (Local runs take roughly 45, 60, 5
  # and 10 s; CI's times differ, so read them from the job log, not from here.)
  phone-zoom:
    # Keep PR validation available when the self-hosted pool is offline.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    # Setup alone has taken ten minutes on a slow host; the four fixtures then need about two. Do not let a slow download
    # cancel the tests before they start.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
            # The tests default to /usr/bin/chromium; point them at the browser Playwright just installed.
            chromium_path="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" || chromium_path=""
            if [ -z "$chromium_path" ] || [ ! -x "$chromium_path" ]; then
              echo "::error::Playwright installed Chromium but gave no usable executable path ('$chromium_path'); the browser tests can't start."
              exit 1
            fi
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
          fi
      - name: Long names never zoom a phone out, and Home across screens and themes
        env:
          REET_UI_URL: http://127.0.0.1:4173
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/phone-zoom-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node web/tests/phone-zoom.e2e.mjs
          node web/tests/shell-fidelity.e2e.mjs
          node web/tests/home.e2e.mjs
          node web/tests/projects.e2e.mjs
      # The Add project dialog's later fixes (stale edit, branch suggestions, filter while a folder opens). It serves the
      # dialog's component fixture with Vite, so it needs no preview server.
      - name: Add project dialog, later fixes
        run: node web/tests/add-project-edit.e2e.mjs

  # The phone browser scripts that need the preview server, split into four jobs that run side by side. They used to be one
  # job of 28 scripts: on the Zoomies pool that took more than the job's 20 minutes (phone-dialogs.e2e alone is about 5, the
  # launch bar 2, sessions.e2e 3), so a push to main was cancelled at its timeout before session-workspace.e2e.mjs ran. Each
  # group below is about a quarter of the time; the times in the log, not this comment, are the budget. A script added to
  # web/tests that needs the preview server goes into the group whose subject it shares; the job that runs it is named in
  # the matrix below (the first keeps the name phone-dialogs, which docs and branch rules refer to).
  phone-dialogs:
    name: ${{ matrix.job }}
    # Keep PR validation available when the self-hosted pool is offline.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    timeout-minutes: 20
    strategy:
      # One failing group must not hide the others' results.
      fail-fast: false
      matrix:
        include:
          # The dialog contract, the launch bar on Home, the phone cases of the Sessions page and the terminal's clipboard and
          # upload. The Add project dialog's folder browser (about 15-20 s) runs here too: it serves its own component
          # fixture with Vite and needs no preview server.
          - job: phone-dialogs
            scripts: phone-dialogs launch sessions-phone terminal-clipboard terminal-upload
          # Chat sessions for each agent: controls, previews, recovery, launch options and the question card.
          - job: phone-chat
            scripts: chat chat-controls chat-previews launch-options chat-recovery chat-claude chat-codex chat-cline chat-cline-source chat-antigravity question-card
          # Gaffer's artwork, theme, variety, return, interaction, progress and layout, and the Account page.
          - job: phone-gaffer
            scripts: gaffer-artwork gaffer-theme gaffer-variety gaffer-return gaffer-interaction gaffer-progress gaffer-layout account
          # The Sessions page and the session screen.
          - job: phone-sessions
            scripts: sessions session-workspace calm-session session-end-gaffer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
            # The tests default to /usr/bin/chromium; point them at the browser Playwright just installed.
            chromium_path="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" || chromium_path=""
            if [ -z "$chromium_path" ] || [ ! -x "$chromium_path" ]; then
              echo "::error::Playwright installed Chromium but gave no usable executable path ('$chromium_path'); the browser tests can't start."
              exit 1
            fi
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
          fi
      - name: Run this group's browser scripts
        env:
          REET_UI_URL: http://127.0.0.1:4173
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/phone-dialogs-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          for script in $SCRIPTS; do
            echo "::group::$script"
            node "web/tests/$script.e2e.mjs"
            echo "::endgroup::"
          done
      - name: Add a project by browsing a machine's folders
        if: matrix.job == 'phone-dialogs'
        run: node web/tests/add-project.e2e.mjs
