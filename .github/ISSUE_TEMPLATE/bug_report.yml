name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. For security problems please use the private route in SECURITY.md instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: From the Admin page, `/api/version` or the image tag.
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Auth mode
      options: [accounts, token, none]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "`docker compose logs reet`, with any tokens removed."
      render: shell
