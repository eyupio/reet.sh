# The reet.sh documentation site.
#
# This is a standalone MkDocs build, deployed separately from the application by
# .github/workflows/docs.yml. It renders the public pages that already live in
# docs/ rather than a second copy, so the site cannot drift from the repository.
#
# The docs are not served by the Go binary. Point REET_PUBLIC_URL at the app and
# route the docs site separately. The docs own https://reet.sh/; DOCS_SITE_URL
# can override the canonical origin for another deployment.

site_name: reet.sh documentation
site_url: !ENV [DOCS_SITE_URL, "https://reet.sh/"]
site_description: >-
  Install reet.sh, connect machines, run AI agents, sync skills and setups, and operate a self-hosted fleet.
site_author: EyUp.io
copyright: reet.sh is AGPL-3.0 licensed.

repo_url: https://github.com/eyupio/reet.sh
repo_name: eyupio/reet.sh
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

hooks:
  - hooks/docs.py

# Keep design notes, research, handoffs and implementation slices out of the
# public site. The pages listed in nav are the curated public set.
exclude_docs: |
  design/
  research/
  handoffs/
  superpowers/
  handoff-golang-code-style.md
  loading.md
  private-skill-revisions.md
  skill-bundle-manifests.md
  skill-content-*.md
  structured-chat-plan.md
  structured-sessions.md
  terminal-history-archive.md
  ui-verification.md
  voice-and-copy.md
  work-orchestration-handoff.md
  yorkshire-copy.md
  requirements.txt

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eyupio/reet.sh
      name: reet.sh on GitHub

nav:
  - Home: index.md
  - Get started:
      - Install the reet binary: binary-installation.md
      - Add a machine: add-machine-in-context.md
      - Interactive CLI home: cli-home.md
      - Local setup discovery: setup-discovery.md
  - Machines and agents:
      - Reet as the central control unit: control-centre.md
      - Agent software: agent-software.md
      - Agent models: agent-models.md
      - Start an agent session: start-agent-session.md
      - Terminal workspace: terminal-workspace.md
      - Terminal launch: terminal-launch.md
      - Worktrees: terminal-worktrees.md
      - Folder browse: folder-browse.md
  - Skills and sync:
      - Skills and Sync: skills-machines-ux.md
      - Enrolled machines: controller-sync.md
      - Environments: environment-sync.md
      - Connect an AI client with MCP: mcp.md
      - Browser skill imports: browser-skill-import.md
      - Machine skill import: machine-skill-import.md
      - Machine content observations: machine-content-observations.md
      - Sharing and audiences: sharing.md
  - Work:
      - Projects: projects.md
      - Session board: session-board.md
  - Operations:
      - Backups: backups.md
      - Single sign-on: single-sign-on.md
      - Email: email.md
      - Notifications: notifications.md
      - Support tickets: support.md
      - Remote machines: remote-machine-operations.md
      - Device checks: device-checks.md
      - Branch pruning: branch-pruning.md
      - Shell command recall: terminal-command-history.md
      - Controller terminal commands: terminal-controller-commands.md
  - Guides:
      - Run Claude Code on a VPS: run-claude-code-on-a-vps.md
      - Sync skills between machines: sync-skills-between-machines.md
      - Connect an AI client with MCP: self-host-mcp-server.md
      - Remote agents without a VPN: remote-agents-without-a-vpn.md
  - Compare:
      - skills.sh: compare-skills-sh.md
      - Open WebUI: compare-open-webui.md
      - LibreChat: compare-librechat.md
  - Reference:
      - Command reference: cli-reference.md
      - Roadmap: roadmap.md
