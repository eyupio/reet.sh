name: terminal browser

on:
  pull_request:
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']
  push:
    branches: [main]
    paths: ['web/**', 'internal/api/**', 'internal/terminalbroker/**', 'internal/terminalagent/**', 'internal/terminalhost/**', 'internal/agenthealth/**', 'internal/privateconn/**', 'go.mod', 'go.sum', '.github/workflows/terminal-browser.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terminal-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci && npm run check && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            "$browser_path" --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Exercise dashboard and terminal workspace UI
        env:
          REET_UI_URL: http://127.0.0.1:4173
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/terminal-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node web/tests/public-workspace.e2e.mjs
          node web/tests/first-run.e2e.mjs
          node web/tests/phone-layout.e2e.mjs
          node web/tests/navigation.e2e.mjs
          node web/tests/readiness.e2e.mjs
          node web/tests/control.e2e.mjs
          node web/tests/machine-import.e2e.mjs
          node web/tests/skill-content.e2e.mjs
          node web/tests/add-machine.e2e.mjs
          node web/tests/start-agent.e2e.mjs
          node web/tests/terminal-workspace.e2e.mjs
          node web/tests/terminal-lifecycle.e2e.mjs
          node web/tests/terminal-organisation.e2e.mjs
      - name: Exercise real browser, broker and persistent tmux shell
        env:
          REET_BROWSER_TESTS: '1'
          REET_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/terminal-browser
        run: go test -race -count=1 -timeout=3m ./internal/api -run '^TestTerminalPrivateLifecyclePreservesActualShell$' -v
      - name: Exercise explicitly enabled root shells
        run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$RUNNER_TEMP/root-go-cache" go test -race -count=1 -timeout=3m ./internal/terminalhost ./internal/scan -run 'TestManagerRetryAndRestartKeepOriginalProcess|TestAgentTerminalEnableAllowsExplicitRootConsent' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: terminal-browser
          path: ${{ runner.temp }}/terminal-browser
          if-no-files-found: ignore
