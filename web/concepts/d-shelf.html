<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>reet.sh – Concept D, Shelf</title>
  <style>
    :root {
      --bg: #f7f6f2; --card: #fffdf9; --ink: #1d1c1a; --muted: #5f5c54; --line: #e4e1d8;
      --accent: #b83a08; --accent-ink: #fff; --tint: #fde8d8; --heart: #be1f4a; --good: #15803d; --bad: #b91c1c;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151413; --card: #1d1c1a; --ink: #efece6; --muted: #a8a399; --line: #33312d; --accent: #fb923c; --accent-ink: #1a1208; --tint: #3a2615; --heart: #ff7a9c; --good: #4ade80; --bad: #f87171; }
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
    .skip { position: absolute; left: 8px; top: -48px; background: var(--accent); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; z-index: 10; }
    .skip:focus { top: 8px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button, input, select, textarea { font: inherit; color: inherit; }
    main { max-width: 760px; margin: 0 auto; padding: clamp(24px, 6vw, 56px) 16px 72px; }

    header h1 { margin: 0; font: 600 clamp(2.4rem, 8vw, 3.6rem)/1 var(--serif); letter-spacing: -0.03em; }
    header h1 span { color: var(--accent); font-style: italic; }
    header p { margin: 10px 0 0; color: var(--muted); font: italic 1.1rem/1.4 var(--serif); max-width: 36ch; }

    .add { display: flex; gap: 8px; margin: 28px 0 8px; }
    .add input { flex: 1; min-width: 0; }
    input, select, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
    .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 14px; cursor: pointer; min-height: 40px; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
    .btn.quiet:hover { color: var(--ink); text-decoration: underline; }
    .btn.danger:hover { color: var(--bad); }
    .notice { margin: 0 0 8px; padding: 8px 12px; border: 1px solid var(--good); border-radius: 10px; background: var(--card); }
    .notice:empty { display: none; }

    .toolbar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
      display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: space-between; align-items: center; padding: 14px 0; margin-top: 16px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
    .filters button { background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; min-height: 36px; }
    .filters button[aria-pressed="true"] { background: var(--tint); color: var(--ink); font-weight: 650; }
    .filters small { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .8; }
    .filters .liked[aria-pressed="true"] { background: var(--heart); color: #fff; }
    .filters .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
    .controls { display: flex; gap: 8px; }
    .controls input { width: 11rem; }
    .controls input, .controls select { min-width: 0; }

    .count { margin: 14px 0 0; color: var(--muted); font-size: .9rem; }
    section { margin-top: 28px; }
    section > h2 { margin: 0; display: flex; align-items: baseline; gap: 10px; font: 600 1.7rem/1.1 var(--serif); letter-spacing: -.02em; }
    section > h2 small { font: 500 .9rem var(--sans); color: var(--muted); font-variant-numeric: tabular-nums; }
    section > .hint { margin: 4px 0 0; color: var(--muted); font: italic .98rem var(--serif); }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    .skill { position: relative; padding: 18px 0 16px 22px; border-bottom: 1px solid var(--line); }
    .skill::before { content: ""; position: absolute; left: 0; top: 22px; bottom: 20px; width: 4px; border-radius: 4px; background: var(--line); }
    .sec-use .skill::before { background: var(--accent); }
    .sec-try .skill::before { background: repeating-linear-gradient(to bottom, var(--accent) 0 6px, transparent 6px 10px); }
    .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .skill h3 { margin: 0; font: 600 1.25rem/1.25 var(--serif); letter-spacing: -.01em; overflow-wrap: anywhere; }
    .skill h3 a { color: inherit; text-decoration-color: var(--line); text-underline-offset: 4px; }
    .skill h3 a:hover { color: var(--accent); text-decoration-color: currentColor; }
    .meta { color: var(--muted); font-size: .85rem; display: flex; gap: 12px; flex-wrap: wrap; }
    .meta code { overflow-wrap: anywhere; }
    .desc { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
    .notes { margin: 12px 0 0; padding: 4px 0 4px 14px; border-left: 2px solid var(--accent); font: italic 1rem/1.5 var(--serif); white-space: pre-wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; align-items: center; }
    .chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 36px; color: var(--ink); }
    .chip:hover { border-color: var(--muted); }
    .chip.move { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .chip.move:hover { background: var(--tint); }
    .chip.heart { color: var(--muted); padding: 4px 12px; }
    .chip.heart[aria-pressed="true"] { color: var(--heart); border-color: var(--heart); font-weight: 600; }
    .spacer { flex: 1; }
    .edit { margin-top: 12px; display: grid; gap: 8px; }
    .edit textarea { width: 100%; resize: vertical; }
    .edit div { display: flex; gap: 8px; }
    .empty { color: var(--muted); font: italic 1.05rem/1.5 var(--serif); padding: 18px 0 6px 22px; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (max-width: 560px) { .add { flex-direction: column; } .controls { width: 100%; } .controls input { flex: 1; width: auto; } .spacer { display: none; } .filters .sep { display: none; } }
    @media (prefers-reduced-motion: no-preference) { .chip, .filters button, .btn { transition: background-color .15s, border-color .15s, color .15s; } }
  </style>
</head>
<body>
  <a class="skip" href="#sections">Skip to your skills</a>
  <main>
    <header>
      <!-- LOGO SLOT: placeholder wordmark, swap for the real logo -->
      <h1>reet<span>.sh</span></h1>
      <p>Keep the reet good AI skills from skills.sh, all in one place.</p>
    </header>

    <form class="add" id="add">
      <label class="vh" for="add-in">Skill URL or slug</label>
      <input id="add-in" placeholder="Paste a skills.sh URL or owner/repo/skill" autocomplete="off" />
      <button class="btn primary" type="submit">Add to shelf</button>
    </form>
    <p class="notice" id="notice" role="status"></p>

    <div class="toolbar" role="group" aria-label="Filter and sort">
      <div class="filters" id="filters"></div>
      <div class="controls">
        <label class="vh" for="q">Search skills</label>
        <input id="q" type="search" placeholder="Search" />
        <label class="vh" for="sort">Sort by</label>
        <select id="sort"><option value="recent">Recent</option><option value="name">Name</option><option value="installs">Installs</option></select>
      </div>
    </div>

    <p class="count" id="count" role="status"></p>
    <div id="sections"></div>
  </main>

  <script src="data.js"></script>
  <script src="shelf.js"></script>
  <script>
    (function () {
      'use strict'
      const { esc, fmt, state } = Shelf
      const $ = (id) => document.getElementById(id)
      // The shelf is a pipeline derived from the existing flags, so no data-model change is needed:
      //   In use = used · To test = saved, not yet used · On the shelf = neither. Liked is separate.
      const SECTIONS = [
        { id: 'use', title: 'In use', hint: 'The ones you actually reach for.', empty: 'Nowt in use yet.', test: (s) => s.used },
        { id: 'try', title: 'To test', hint: 'Saved to give a go.', empty: 'Nowt waiting to be tested.', test: (s) => !s.used && s.bookmarked },
        { id: 'shelf', title: 'On the shelf', hint: 'Spotted, not sorted yet.', empty: 'Nowt else on the shelf.', test: (s) => !s.used && !s.bookmarked },
      ]
      const colOf = (s) => SECTIONS.find((c) => c.test(s))
      let focusSec = 'all', onlyLiked = false, editing = null

      function render() {
        const all = Shelf.view()
        const filtering = !!state.q.trim() || onlyLiked
        const rows = all.filter((s) => !onlyLiked || s.liked)
        const n = (c) => Shelf.skills.filter(c.test).length

        $('filters').innerHTML =
          `<button type="button" data-fk="f-all" data-sec="all" aria-pressed="${focusSec === 'all'}">All<small>${Shelf.skills.length}</small></button>` +
          SECTIONS.map((c) => `<button type="button" data-fk="f-${c.id}" data-sec="${c.id}" aria-pressed="${focusSec === c.id}">${c.title}<small>${n(c)}</small></button>`).join('') +
          `<span class="sep" aria-hidden="true"></span><button type="button" class="liked" data-fk="f-liked" data-liked aria-pressed="${onlyLiked}">♥ Liked<small>${Shelf.counts().liked}</small></button>`

        const shown = SECTIONS.filter((c) => focusSec === 'all' || focusSec === c.id)
        const html = shown.map((c) => {
          const items = rows.filter(c.test)
          if (!items.length && filtering) return ''
          return `<section class="sec-${c.id}" aria-labelledby="h-${c.id}"><h2 id="h-${c.id}">${c.title}<small>${items.length}</small></h2>
            <p class="hint">${c.hint}</p>
            <ul>${items.length ? items.map((s) => card(s, c.id)).join('') : `<li class="empty">${c.empty}</li>`}</ul></section>`
        }).join('')
        const total = shown.reduce((a, c) => a + rows.filter(c.test).length, 0)
        $('count').textContent = total === 1 ? '1 skill' : total + ' skills'
        $('sections').innerHTML = html.trim() ? html : `<p class="empty" style="padding-left:0;text-align:center">Nowt matches that.</p>`
      }

      function moves(s, col) {
        const b = (i, label, flag, primary) =>
          `<button type="button" class="chip${primary ? ' move' : ''}" data-fk="mv${i}-${esc(s.id)}" data-id="${esc(s.id)}" data-flag="${flag}">${label}</button>`
        if (col === 'shelf') return b(1, 'Save to test', 'bookmarked', true) + b(2, 'Start using', 'used')
        if (col === 'try') return b(1, 'Start using', 'used', true) + b(2, 'Back to shelf', 'bookmarked')
        return b(1, 'Stop using', 'used')
      }
      function card(s, col) {
        const title = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.name)}<span class="vh"> (opens skills.sh)</span></a>` : esc(s.name)
        const notes = editing === s.id
          ? `<div class="edit"><label class="vh" for="n-${esc(s.id)}">Notes for ${esc(s.name)}</label><textarea id="n-${esc(s.id)}" data-fk="ta-${esc(s.id)}" rows="3" placeholder="Why you like it, how you use it…">${esc(s.notes)}</textarea>
             <div><button class="btn primary" type="button" data-save="${esc(s.id)}">Save notes</button><button class="btn quiet" type="button" data-cancel>Cancel</button></div></div>`
          : s.notes ? `<p class="notes">${esc(s.notes)}</p>` : ''
        return `<li class="skill">
          <div class="row"><h3>${title}</h3><div class="meta"><code>${s.sourceType === 'local' ? 'unlinked' : esc(s.source)}</code>${s.installs ? `<span>${fmt(s.installs)} installs</span>` : ''}</div></div>
          ${s.description ? `<p class="desc">${esc(s.description)}</p>` : ''}
          <div class="actions">${moves(s, col)}
            <button type="button" class="chip heart" data-fk="lk-${esc(s.id)}" data-id="${esc(s.id)}" data-flag="liked" aria-pressed="${s.liked}"><span aria-hidden="true">${s.liked ? '♥' : '♡'}</span>Like</button>
            <span class="spacer"></span>
            <button class="btn quiet" type="button" data-fk="nt-${esc(s.id)}" data-notes="${esc(s.id)}" aria-expanded="${editing === s.id}">Notes</button>
            <button class="btn quiet danger" type="button" data-fk="rm-${esc(s.id)}" data-remove="${esc(s.id)}" aria-label="Remove ${esc(s.name)}">Remove</button></div>
          ${notes}</li>`
      }

      function say(msg) { $('notice').textContent = msg; clearTimeout(say.t); say.t = setTimeout(() => ($('notice').textContent = ''), 4000) }
      function redraw() {
        const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.fk : ''
        Shelf.keepFocus(render)
        // A moved skill may no longer have the button that had focus; land on its first move button instead.
        if (/^mv\d-/.test(fk || '') && document.activeElement === document.body) {
          const el = document.querySelector('[data-fk="mv1-' + CSS.escape(fk.slice(4)) + '"]')
          if (el) el.focus()
        }
      }
      Shelf.onChange(redraw)

      document.addEventListener('click', (e) => {
        const t = e.target.closest('button'); if (!t) return
        if (t.dataset.sec) { focusSec = t.dataset.sec; redraw() }
        else if (t.hasAttribute('data-liked')) { onlyLiked = !onlyLiked; redraw() }
        else if (t.dataset.flag) {
          const s = Shelf.skills.find((x) => x.id === t.dataset.id), before = colOf(s)
          Shelf.toggle(t.dataset.id, t.dataset.flag)
          const after = colOf(s)
          if (after !== before) say(`Moved ${s.name} to ${after.title}.`)
        }
        else if (t.dataset.notes !== undefined) { editing = editing === t.dataset.notes ? null : t.dataset.notes; redraw() }
        else if (t.dataset.save) { Shelf.setNotes(t.dataset.save, $('n-' + t.dataset.save).value); editing = null; redraw() }
        else if (t.hasAttribute('data-cancel')) { editing = null; redraw() }
        else if (t.dataset.remove) {
          const i = Shelf.skills.findIndex((x) => x.id === t.dataset.remove)
          if (i > -1 && confirm(`Remove ${Shelf.skills[i].name} from your shelf?`)) { Shelf.skills.splice(i, 1); say('Sorted, removed.'); $('q').focus(); redraw() }
        }
      })
      $('q').addEventListener('input', (e) => Shelf.set({ q: e.target.value }))
      $('sort').addEventListener('change', (e) => Shelf.set({ sort: e.target.value }))
      $('add').addEventListener('submit', (e) => {
        e.preventDefault()
        const s = Shelf.add($('add-in').value)
        if (s) { $('add-in').value = ''; say('Reet, added ' + s.name + ' to the shelf.') }
      })
      render()
    })()
  </script>
</body>
</html>
