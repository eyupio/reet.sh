name: Cleanup Old Container Images

# image.yml updates the moving tag (latest) in place and leaves untagged package
# versions behind. "Untagged" is not "unused": the platform and attestation
# manifests under a multi-platform tag are untagged versions too, and deleting
# them breaks `docker pull` with "manifest unknown".
#
# .github/scripts/ghcr-prune.sh deletes an untagged version only when no tagged or
# recent version refers to it, and deletes nothing when it cannot tell. Tagged
# versions (latest, vX.Y.Z, sha-*) are never deleted.
#
# A manual run is a dry run unless asked otherwise. Check the dry run output
# before relying on the scheduled run, which deletes for real.

on:
  schedule:
    - cron: "47 2 * * *" # daily at 02:47 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it."
        type: boolean
        default: true
      keep_days:
        description: "Never delete an untagged version younger than this many days."
        type: string
        default: "14"

permissions: {}

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup reet.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Test the prune
        run: .github/scripts/ghcr-prune-test.sh
      - name: Delete unreferenced untagged versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          KEEP_DAYS: ${{ inputs.keep_days || '14' }}
        run: .github/scripts/ghcr-prune.sh reet.sh
      - name: Check that every tag still pulls
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ghcr-check-tags.sh reet.sh latest
