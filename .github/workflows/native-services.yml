name: native services

on:
  pull_request:
    paths:
      - 'internal/terminalhost/**'
      - 'internal/terminalagent/**'
      - 'internal/terminalbroker/**'
      - 'internal/terminalproto/**'
      - 'internal/api/**'
      - 'internal/scan/**'
      - 'internal/agenthealth/**'
      - 'internal/privateconn/**'
      - 'internal/filelock/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-services.yml'
  push:
    branches: [main]
    paths:
      - 'internal/terminalhost/**'
      - 'internal/terminalagent/**'
      - 'internal/terminalbroker/**'
      - 'internal/terminalproto/**'
      - 'internal/api/**'
      - 'internal/scan/**'
      - 'internal/agenthealth/**'
      - 'internal/privateconn/**'
      - 'internal/filelock/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/native-services.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('push-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  tmux-minimum:
    name: tmux minimum (3.2)
    # Keep PR validation available when the self-hosted pool is offline.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'zoomies-linux-x64' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build terminal host test binary
        run: CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/terminalhost.test" ./internal/terminalhost
      - name: Run tests against tmux 3.2
        run: |
          # The container's own DNS, not the runner's: on 11 November the runner's resolver could not look
          # up any *.ubuntu.com name ("Temporary failure resolving 'archive.ubuntu.com'"), with the container on
          # the bridge or on the host network alike, so the install failed before any test ran. Public
          # resolvers avoid that. Each try fails fast (15 s per fetch) and the install falls back to a mirror
          # outside ubuntu.com, so a bad network costs a few minutes and never the job's whole timeout.
          docker run --rm --dns 1.1.1.1 --dns 8.8.8.8 \
            -v "$RUNNER_TEMP/terminalhost.test:/terminalhost.test:ro" \
            ubuntu:22.04 \
            bash -ec '
              apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
              install() { apt-get update -qq $apt_opts && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $apt_opts tmux git >/dev/null; }
              installed=
              for attempt in 1 2 3; do
                if install; then installed=1; break; fi
                if [ "$attempt" = 1 ]; then
                  echo "package install failed; trying a mirror outside ubuntu.com"
                  sed -i "s#http://\(archive\|security\).ubuntu.com/ubuntu#http://mirrors.edge.kernel.org/ubuntu#g" /etc/apt/sources.list
                else
                  echo "package install failed (attempt $attempt); retrying in $((attempt * 10))s"
                  sleep $((attempt * 10))
                fi
              done
              [ -n "$installed" ] || { echo "::error::could not install tmux and git"; exit 1; }
              tmux -V
              tmux -V | grep -Eq "^tmux 3\.2"
              /terminalhost.test -test.timeout=8m
            '

  native-service:
    name: native service (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Prepare Linux user service manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          sleep 2
          systemctl --user daemon-reload
          systemctl --user status --no-pager || true
      - name: Run terminal host tests
        run: go test -race -count=1 -timeout=8m ./internal/terminalhost
      - name: Run terminal broker and real PTY integration tests
        run: go test -race -count=1 -timeout=3m ./internal/scan ./internal/terminalbroker ./internal/api -run '^Test(AgentDaemon|AgentControl|Terminal|Tickets|OfflineCreate|ReverseBinding|ReconnectDoes|SlowConsumer|RevokedLogin)'
      - name: Run native service test
        env:
          REET_NATIVE_SERVICE_TESTS: '1'
          REET_NATIVE_AGENT_BINARY: ${{ runner.temp }}/reet-native-agent
        run: |
          go build -o "$REET_NATIVE_AGENT_BINARY" ./cmd/reet
          go test -race -count=1 -timeout=4m -run TestNativeAgentKillKeepsTmuxSession -v ./internal/terminalhost
      - name: Run root system-service recovery test
        run: sudo env "PATH=$PATH" "GOPATH=$(go env GOPATH)" "GOCACHE=$RUNNER_TEMP/root-native-go-cache" REET_NATIVE_SERVICE_TESTS=1 "REET_NATIVE_AGENT_BINARY=$RUNNER_TEMP/reet-native-agent" go test -race -count=1 -timeout=4m -run TestNativeAgentKillKeepsTmuxSession -v ./internal/terminalhost
