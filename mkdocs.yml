# The reet.sh documentation site.
#
# This is a standalone MkDocs build, deployed separately from the application by
# .github/workflows/docs.yml. It renders the public pages that already live in
# docs/ rather than a second copy, so the site cannot drift from the repository.
#
# The docs are not served by the Go binary. Point REET_PUBLIC_URL at the app and
# route the docs site separately. The docs own https://reet.sh/; DOCS_SITE_URL
# can override the canonical origin for another deployment.

site_name: reet.sh
site_url: !ENV [DOCS_SITE_URL, "https://reet.sh/"]
site_description: >-
  Your self-hosted control room for AI coding agents, sessions and skills across your machines. One Go binary. SQLite. No telemetry.
site_author: EyUp.io
copyright: reet.sh is AGPL-3.0 licensed.

repo_url: https://github.com/eyupio/reet.sh
repo_name: eyupio/reet.sh
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  font: false
  logo: assets/brand/horizontal-color-light.svg
  favicon: assets/brand/icon-color-light.svg
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra_css:
  - assets/stylesheets/reet.css
  - assets/stylesheets/mkdocs.css

extra_javascript:
  - assets/javascripts/reet.js

hooks:
  - hooks/docs.py

# Keep design notes, research, handoffs and implementation slices out of the
# public site. The pages listed in nav are the curated public set.
exclude_docs: |
  design/
  research/
  handoffs/
  superpowers/
  handoff-golang-code-style.md
  loading.md
  private-skill-revisions.md
  skill-bundle-manifests.md
  skill-content-*.md
  structured-chat-plan.md
  structured-sessions.md
  terminal-history-archive.md
  ui-verification.md
  voice-and-copy.md
  work-orchestration-handoff.md
  yorkshire-copy.md
  requirements.txt

extra:
  generator: false
  noindex: !ENV [DOCS_NOINDEX, false]
  field_guides:
    - run-claude-code-on-a-vps.md
    - sync-skills-between-machines.md
    - self-host-mcp-server.md
    - remote-agents-without-a-vpn.md
    - run-codex-in-a-browser.md
    - parallel-coding-agents-git-worktrees.md
    - self-hosted-ai-agent-control-room.md
    - self-hosted-ai-agents-checklist.md
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eyupio/reet.sh
      name: reet.sh on GitHub

