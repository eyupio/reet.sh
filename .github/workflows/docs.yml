name: docs

# Builds the standalone MkDocs site from docs/ and publishes it to GitHub Pages.
# The application image does not contain the docs; route the public docs origin
# (or /docs/) to this deployment separately.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "hooks/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "hooks/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - run: pip install -r docs/requirements.txt

      # --strict makes a broken internal link or a missing page fail the build
      # instead of shipping a site with dead ends.
      - name: Build
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://reet.sh/docs/' }}
        run: mkdocs build --strict

      - name: Check the sitemap, robots and home page exist
        run: |
          set -eu
          test -f site/index.html
          test -f site/sitemap.xml
          test -f site/robots.txt
          grep -q "reet.sh documentation" site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
