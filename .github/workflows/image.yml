name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  # This job is the full suite (web check, MCP tests, go vet, go test -race ./...), so it has to run whenever anything
  # it compiles could change. Documentation, brand artwork and the other workflows are not compiled into the binary or
  # the image, so a pull request that only touches those does not need a 20-minute Go run. Pushes and tags stay
  # unfiltered: every image that is published has been tested.
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'mcp/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: zoomies-linux-x64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install tmux when the runner lacks it
        run: |
          if command -v tmux >/dev/null; then tmux -V; exit 0; fi
          if [ "$(id -u)" = 0 ]; then as_root=""; elif command -v sudo >/dev/null; then as_root="sudo"; else
            echo "::error::tmux is missing and this runner is neither root nor has sudo to install it."; exit 1; fi
          $as_root apt-get update && $as_root apt-get install -y tmux
          tmux -V
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm ci
        working-directory: mcp
      - name: Compile the MCP test fixture once, outside the tests' 180 s build limit
        run: go build -o /dev/null ./mcp/test/fixture
      - run: npm test
        working-directory: mcp
      - run: go vet ./...
      - run: go test -race -timeout=20m ./...

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: zoomies-linux-x64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
