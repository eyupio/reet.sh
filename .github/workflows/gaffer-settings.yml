name: Gaffer settings browser

on:
  pull_request:
    paths: ['web/**', 'scripts/run-browser-suites.sh', '.github/workflows/gaffer-settings.yml']
  push:
    branches: [main]
    paths: ['web/**', 'scripts/run-browser-suites.sh', '.github/workflows/gaffer-settings.yml']

permissions:
  contents: read

concurrency:
  group: gaffer-settings-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The 21 scripts (web/tests/ci-gaffer-settings.txt) used to run one after another in one job and took about 11 minutes, the
  # longest of the browser jobs. They run as three shards side by side through scripts/run-browser-suites.sh, which runs every
  # script and names every one that failed. The job named gaffer-settings, below, is the one result that waits for them.
  gaffer-ui:
    name: gaffer-settings (${{ matrix.shard }})
    runs-on: zoomies-linux-x64
    timeout-minutes: 30
    strategy:
      # One failing shard must not hide the others' results.
      fail-fast: false
      matrix:
        shard: ['1', '2', '3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - name: Prepare Chromium
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          chromium_path="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          test -x "$chromium_path"
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Exercise Gaffer settings and companion chat
        env:
          REET_UI_URL: http://127.0.0.1:4173
          REET_UI_SCREENSHOTS: ${{ runner.temp }}/gaffer-settings
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/gaffer-settings-ui.log" 2>&1 &
          ui_pid=$!
          trap 'kill "$ui_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          scripts/run-browser-suites.sh --list web/tests/ci-gaffer-settings.txt --shard ${{ matrix.shard }} --of 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaffer-settings-${{ matrix.shard }}
          path: ${{ runner.temp }}/gaffer-settings
          if-no-files-found: ignore

  # The one result for the Gaffer settings and Factory browser scripts; branch rules and docs refer to this name.
  gaffer-settings:
    needs: [gaffer-ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "gaffer-ui: ${{ needs.gaffer-ui.result }}"
          [ "${{ needs.gaffer-ui.result }}" = success ]
