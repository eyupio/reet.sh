name: Cleanup Old Container Images

# image.yml updates the moving tags (latest, dev) in place and leaves untagged
# package versions behind. "Untagged" is not "unused": the platform manifests
# under a multi-platform tag are untagged versions too, and deleting them breaks
# `docker pull` with "manifest unknown".
#
# Every commit also publishes a sha-<short> tag, so the package would otherwise
# keep one tagged version (and its platform manifests) per commit for ever.
# .github/scripts/ghcr-prune-tags.sh deletes a version only when every tag on it
# is a per-commit tag, it is old, it is outside the newest commits, and no kept
# version refers to it. .github/scripts/ghcr-prune.sh then deletes the untagged
# versions that nothing refers to. Both fail closed: nothing is deleted when a
# manifest or run cannot be read.
#
# A manual run is a dry run unless asked otherwise. Check the dry run output
# before relying on the scheduled run, which deletes for real.

on:
  schedule:
    - cron: "47 2 * * *" # daily at 02:47 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it."
        type: boolean
        default: true
      keep_days:
        description: "Never delete an untagged version younger than this many days."
        type: string
        default: "14"
      tag_keep_days:
        description: "Never delete a per-commit tagged version younger than this many days."
        type: string
        default: "30"
      tag_keep_commits:
        description: "Always keep the versions of this many newest commits."
        type: string
        default: "20"

permissions: {}

concurrency:
  group: cleanup-packages
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup reet.sh
    runs-on: zoomies-linux-x64
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Test the prune
        run: .github/scripts/ghcr-prune-test.sh
      - name: Test the tag prune
        run: .github/scripts/ghcr-prune-tags-test.sh
      - name: Delete old per-commit tagged versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          TAG_KEEP_DAYS: ${{ inputs.tag_keep_days || '30' }}
          TAG_KEEP_COMMITS: ${{ inputs.tag_keep_commits || '20' }}
        run: .github/scripts/ghcr-prune-tags.sh reet.sh
      - name: Delete unreferenced untagged versions
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          KEEP_DAYS: ${{ inputs.keep_days || '14' }}
        run: .github/scripts/ghcr-prune.sh reet.sh
      - name: Check that every tag still pulls
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/ghcr-check-tags.sh reet.sh latest dev
