# Reads settings from ./.env (see .env.example). Run `sh scripts/init-env.sh` to create it.
services:
  reet:
    image: ghcr.io/eyupio/reet.sh:${REET_VERSION:-latest}
    container_name: reet
    restart: unless-stopped
    # Run as your own user so the bind-mounted data folder stays yours.
    user: "${REET_UID:-1000}:${REET_GID:-1000}"
    ports:
      - "${REET_PORT:-8080}:8080"
    environment:
      REET_AUTH: ${REET_AUTH:-accounts}
      REET_TOKEN: ${REET_TOKEN:-}
      SKILLS_SH_TOKEN: ${SKILLS_SH_TOKEN:-}
      REET_LOG: ${REET_LOG:-}
      REET_TOPICS: ${REET_TOPICS:-}
      REET_REFRESH: ${REET_REFRESH:-}
      REET_CONTROLLER_URL: ${REET_CONTROLLER_URL:-}
      REET_CONTROLLER_TOKEN: ${REET_CONTROLLER_TOKEN:-}
      REET_ENV: ${REET_ENV:-}
      REET_BACKUP_KEY: ${REET_BACKUP_KEY:-}
      REET_BACKUP_DIR: ${REET_BACKUP_DIR:-}
      REET_BACKUP_EVERY: ${REET_BACKUP_EVERY:-}
      REET_BACKUP_KEEP: ${REET_BACKUP_KEEP:-}
      REET_BACKUP_USER_EVERY: ${REET_BACKUP_USER_EVERY:-}
      REET_BACKUP_USER_KEEP: ${REET_BACKUP_USER_KEEP:-}
      REET_BACKUP_S3_ENDPOINT: ${REET_BACKUP_S3_ENDPOINT:-}
      REET_BACKUP_S3_REGION: ${REET_BACKUP_S3_REGION:-}
      REET_BACKUP_S3_BUCKET: ${REET_BACKUP_S3_BUCKET:-}
      REET_BACKUP_S3_PREFIX: ${REET_BACKUP_S3_PREFIX:-}
      REET_BACKUP_S3_ACCESS_KEY_ID: ${REET_BACKUP_S3_ACCESS_KEY_ID:-}
      REET_BACKUP_S3_SECRET_ACCESS_KEY: ${REET_BACKUP_S3_SECRET_ACCESS_KEY:-}
      REET_BACKUP_S3_PATH_STYLE: ${REET_BACKUP_S3_PATH_STYLE:-}
      REET_BACKUP_S3_NAME: ${REET_BACKUP_S3_NAME:-}
      REET_BACKUP_ALLOW_LOCAL: ${REET_BACKUP_ALLOW_LOCAL:-}
    volumes:
      # Bind mount to a host folder (not a Docker volume).
      - ${REET_DATA_PATH:-./data}:/data
    healthcheck:
      test: ["CMD", "/reet", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
