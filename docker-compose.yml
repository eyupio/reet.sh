services:
  reet:
    image: ghcr.io/eyupio/reet.sh:latest
    container_name: reet
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional: require this token for the UI's API and the bookmarklets.
      REET_TOKEN: ${REET_TOKEN:-}
      # Optional: skills.sh API token (needs a Vercel OIDC token). Without it, reet reads the public pages.
      SKILLS_SH_TOKEN: ${SKILLS_SH_TOKEN:-}
    volumes:
      - reet-data:/data
    healthcheck:
      test: ["CMD", "/reet", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  reet-data:
