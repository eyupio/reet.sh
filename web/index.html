<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)" />

    <title>reet.sh – your machines and terminals</title>
    <meta
      name="description"
      content="A self-hosted workspace for your machines and remote terminals. Connect your laptops and servers, use installed tools and agents, and return to persistent shell sessions. Your infrastructure, your control."
    />
    <meta name="application-name" content="reet.sh" />
    <meta name="author" content="EyUp.io" />

    <!-- Open Graph / social previews. og:image must be an absolute URL, so this assumes the public origin https://reet.sh. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="reet.sh" />
    <meta property="og:title" content="reet.sh – your machines and terminals" />
    <meta property="og:description" content="Your laptops, servers and persistent terminal sessions in one self-hosted workspace." />
    <meta property="og:url" content="https://reet.sh/" />
    <meta property="og:image" content="https://reet.sh/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="reet.sh: Your machines. Your terminals. One workspace." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="reet.sh – your machines and terminals" />
    <meta name="twitter:description" content="Your machines and persistent terminal sessions in one self-hosted workspace." />
    <meta name="twitter:image" content="https://reet.sh/og-image.png" />
    <meta name="twitter:image:alt" content="reet.sh: Your machines. Your terminals. One workspace." />

    <!-- Icons: SVG for modern browsers (follows light/dark), ICO as the fallback, PNGs for iOS and installs. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
